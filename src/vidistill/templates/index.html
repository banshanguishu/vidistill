<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vidistill — 视频内容 AI 总结</title>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
    max-width: 720px; margin: 3rem auto; padding: 0 1.5rem;
    color: #222; background: #fafafa; line-height: 1.6;
  }
  h1 { margin: 0 0 .25rem; }
  .subtitle { color: #666; margin: 0 0 2rem; }
  .card { background: white; border: 1px solid #e3e3e3; border-radius: 8px; padding: 1.5rem; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  label { display: block; font-weight: 600; margin: 1rem 0 .4rem; }
  input[type=url], select { width: 100%; padding: .65rem .8rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; }
  input[type=url]:focus, select:focus { outline: 2px solid #1a73e8; outline-offset: -1px; }
  .hint { font-size: .85rem; color: #777; margin-top: .3rem; }
  .radio-group { display: flex; gap: .8rem; flex-wrap: wrap; }
  .radio-card { flex: 1 1 240px; border: 1px solid #ccc; border-radius: 6px; padding: .8rem 1rem; cursor: pointer; transition: all .15s; }
  .radio-card.selected { border-color: #1a73e8; background: #f0f7ff; }
  .radio-card strong { display: block; }
  .radio-card .desc { font-size: .85rem; color: #555; margin-top: .25rem; }
  button.primary {
    margin-top: 1.5rem; width: 100%; padding: .9rem; font-size: 1rem; font-weight: 600;
    background: #1a73e8; color: white; border: none; border-radius: 6px; cursor: pointer;
  }
  button.primary:hover { background: #1664c8; }
  button.primary:disabled { background: #aaa; cursor: not-allowed; }
  .progress { margin-top: 1rem; }
  .progress-bar { height: 8px; background: #e3e3e3; border-radius: 4px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: #1a73e8; transition: width .3s; }
  .status-text { margin-top: .5rem; color: #555; font-size: .9rem; }
  .error { color: #c62828; background: #fee; border: 1px solid #fcc; padding: .8rem 1rem; border-radius: 6px; margin-top: 1rem; }
  .success { color: #2e7d32; background: #efe; border: 1px solid #cec; padding: .8rem 1rem; border-radius: 6px; margin-top: 1rem; }
  .download-row { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: .8rem; }
  a.download, button.download-disabled {
    flex: 1 1 0; min-width: 140px; padding: .6rem 1rem; text-align: center;
    text-decoration: none; border-radius: 6px; font-weight: 600; cursor: pointer;
    border: none;
  }
  a.download { background: #2e7d32; color: white; }
  a.download:hover { background: #246627; }
  button.download-disabled { background: #ccc; color: #666; cursor: not-allowed; }
  button.retry { margin-top: 1rem; padding: .5rem 1rem; background: #555; color: white; border: none; border-radius: 6px; cursor: pointer; }
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid #e0e0e0;
    border-top-color: #1a73e8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* === v2 visual polish === */
  h1 { font-size: 2rem; letter-spacing: -.02em; }
  .card { box-shadow: 0 1px 3px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.02); }
  .card h2 { font-size: 1.15rem; margin-bottom: .25rem; }

  /* Status badge pills */
  .badge {
    display: inline-flex;
    align-items: center;
    padding: .25rem .7rem;
    border-radius: 999px;
    font-size: .8rem;
    font-weight: 600;
    white-space: nowrap;
    line-height: 1.4;
  }
  .badge-queued     { background: #e3f2fd; color: #1565c0; }
  .badge-processing { background: #fff3e0; color: #ef6c00; }
  .badge-done       { background: #e8f5e9; color: #2e7d32; }
  .badge-failed     { background: #ffebee; color: #c62828; cursor: help; }
  .badge-cancelled  { background: #f5f5f5; color: #757575; }

  /* Small inline spinner for badges */
  .badge .spinner-sm {
    display: inline-block;
    width: 10px; height: 10px;
    border: 1.5px solid currentColor;
    border-top-color: transparent;
    border-radius: 50%;
    opacity: .7;
    animation: spin 0.8s linear infinite;
    margin-right: 5px;
  }

  /* Action buttons in jobs table */
  .btn-action {
    display: inline-block;
    padding: .35rem .75rem;
    margin-right: .3rem;
    border-radius: 6px;
    font-size: .82rem;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all .15s;
    line-height: 1.4;
  }
  .btn-action-download { background: #1a73e8; color: white; }
  .btn-action-download:hover { background: #1664c8; }
  .btn-action-download.pdf { background: #34a853; }
  .btn-action-download.pdf:hover { background: #2d8e47; }
  .btn-action-cancel {
    background: white;
    border-color: #d93025;
    color: #d93025;
  }
  .btn-action-cancel:hover { background: #d93025; color: white; }

  /* Jobs table */
  .jobs-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  .jobs-table th {
    text-align: left; padding: .55rem .5rem;
    font-size: .75rem; font-weight: 600;
    color: #666; text-transform: uppercase; letter-spacing: .04em;
    border-bottom: 2px solid #e3e3e3;
  }
  .jobs-table td { padding: .75rem .5rem; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
  .jobs-table tbody tr { transition: background .15s; }
  .jobs-table tbody tr:hover { background: #fafbfd; }
  .jobs-table .col-status  { width: 130px; white-space: nowrap; }
  .jobs-table .col-actions { width: 220px; white-space: nowrap; }
  .jobs-table .col-title   { color: #222; word-break: break-word; }

  /* Queue status indicator (above table) */
  .queue-indicator {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    padding: .35rem .8rem;
    border-radius: 6px;
    font-size: .85rem;
    margin-top: .3rem;
  }
  .queue-indicator.warn { background: #fff5f5; color: #c62828; border: 1px solid #fcc; }
  .queue-indicator.info { background: #f0f7ff; color: #1565c0; border: 1px solid #d6e6fb; }
</style>
</head>
<body>

<h1>vidistill</h1>
<p class="subtitle">粘贴视频链接 → AI 总结 → 下载</p>

<div class="card" x-data="vidistillApp()">

  <!-- Form -->
  <template x-if="phase === 'idle' || phase === 'submitting' || phase === 'error_input'">
    <div>
      <label for="url">视频链接</label>
      <input id="url" type="url" x-model="url" placeholder="https://www.youtube.com/watch?v=... 或 https://www.bilibili.com/video/..." required>
      <div class="hint">支持 YouTube、Bilibili 等 yt-dlp 兼容平台。视频时长不超过 30 分钟。</div>

      <label>总结形态</label>
      <div class="radio-group">
        <label class="radio-card" :class="{ selected: style === 'short' }">
          <input type="radio" x-model="style" value="short" style="display:none">
          <strong>短摘要</strong>
          <div class="desc">3-5 句核心要点 + 5-10 条 bullet。适合快速判断"这视频值不值得看"。</div>
        </label>
        <label class="radio-card" :class="{ selected: style === 'chapters' }">
          <input type="radio" x-model="style" value="chapters" style="display:none">
          <strong>章节笔记</strong>
          <div class="desc">按视频章节切分，每章一段总结 + bullet，带时间戳。适合反复查阅。</div>
        </label>
      </div>

      <button class="primary" @click="submit()" :disabled="phase === 'submitting' || !url">
        <span x-show="phase !== 'submitting'">开始生成</span>
        <span x-show="phase === 'submitting'">提交中...</span>
      </button>

      <div class="error" x-show="phase === 'error_input'" x-text="errorMessage"></div>
    </div>
  </template>

  <!-- Progress -->
  <template x-if="phase === 'polling'">
    <div>
      <div class="status-text"><strong x-text="videoTitle || '处理中'"></strong></div>
      <div class="status-text">
        <span class="spinner"></span>
        <span x-text="statusLabel()"></span>
      </div>
      <div class="progress">
        <div class="progress-bar"><div class="progress-bar-fill" :style="`width: ${progress}%`"></div></div>
      </div>
      <div class="status-text" x-text="`${progress}%`"></div>
    </div>
  </template>

  <!-- Ready to download -->
  <template x-if="phase === 'ready_to_download'">
    <div>
      <div class="success">总结完成！</div>
      <div><strong x-text="videoTitle"></strong></div>
      <div class="download-row">
        <a class="download" :href="`/jobs/${jobId}/download/md`">下载 Markdown</a>
        <a class="download" :href="`/jobs/${jobId}/download/html`">下载 HTML</a>
        <template x-if="availableFormats.includes('pdf')">
          <a class="download" :href="`/jobs/${jobId}/download/pdf`">下载 PDF</a>
        </template>
        <template x-if="!availableFormats.includes('pdf')">
          <button class="download-disabled" disabled title="PDF 需在服务器环境（含 GTK/字体库）生成；本地 Windows 环境无法生成。Docker 部署后可用。">下载 PDF（不可用）</button>
        </template>
      </div>
      <br>
      <button class="retry" @click="reset()">再来一个</button>
    </div>
  </template>

  <!-- Processing error -->
  <template x-if="phase === 'error_processing'">
    <div>
      <div class="error" x-text="errorMessage"></div>
      <button class="retry" @click="retry()">重试</button>
      <button class="retry" @click="reset()">换一个视频</button>
    </div>
  </template>
</div>

<div class="card" x-data="myJobsApp()" x-init="init()" style="margin-top: 1.5rem;">
  <h2 style="margin-top: 0;">我的任务（最近 7 天）</h2>

  <div class="queue-indicator warn" x-show="systemQueueFull">
    ⚠ 当前队列已满（10 / 10），请稍后再提交
  </div>
  <div class="queue-indicator info" x-show="!systemQueueFull && systemActiveCount > 0">
    ✓ 当前队列：<span x-text="systemActiveCount"></span> / 10
  </div>

  <table class="jobs-table" x-show="jobs.length > 0">
    <thead>
      <tr>
        <th>标题</th>
        <th class="col-status">状态</th>
        <th class="col-actions">操作</th>
      </tr>
    </thead>
    <tbody>
      <template x-for="j in jobs" :key="j.job_id">
        <tr>
          <td class="col-title" x-text="j.video_title || j.job_id"></td>
          <td class="col-status">
            <span class="badge"
                  :class="badgeClass(j.status)"
                  :title="j.status === 'failed' ? (j.error || '处理失败') : ''">
              <span class="spinner-sm" x-show="!isTerminal(j.status)"></span>
              <span x-text="statusLabel(j)"></span>
            </span>
          </td>
          <td class="col-actions">
            <template x-if="j.status === 'queued'">
              <button @click="cancel(j.job_id)" class="btn-action btn-action-cancel">取消</button>
            </template>
            <template x-if="j.status === 'done'">
              <span>
                <a :href="`/jobs/${j.job_id}/download/md`" class="btn-action btn-action-download">MD</a>
                <a :href="`/jobs/${j.job_id}/download/html`" class="btn-action btn-action-download">HTML</a>
                <template x-if="j.available_formats.includes('pdf')">
                  <a :href="`/jobs/${j.job_id}/download/pdf`" class="btn-action btn-action-download pdf">PDF</a>
                </template>
              </span>
            </template>
          </td>
        </tr>
      </template>
    </tbody>
  </table>

  <div x-show="jobs.length === 0" class="status-text" style="margin-top: .8rem;">
    暂无任务。如果之前提交过却看不到，请检查浏览器是否启用 Cookie。
  </div>
</div>

<script>
function vidistillApp() {
  return {
    phase: 'idle',
    url: '',
    style: 'chapters',
    availableFormats: [],
    jobId: null,
    progress: 0,
    status: 'pending',
    videoTitle: '',
    errorMessage: '',
    pollTimer: null,
    queuePosition: null,

    init() {
      // Warn the user before closing tab/window while a job is in progress.
      // Browsers (Chrome/Edge/Firefox) ignore custom message text for anti-phishing;
      // they show their own generic confirmation. Setting returnValue triggers it.
      window.addEventListener('beforeunload', (e) => {
        if (this.phase === 'submitting' || this.phase === 'polling') {
          e.preventDefault();
          e.returnValue = '';
          return '';
        }
      });
    },

    async submit() {
      this.phase = 'submitting';
      this.errorMessage = '';
      try {
        const resp = await fetch('/jobs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: this.url, style: this.style }),
        });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({ detail: '提交失败' }));
          this.errorMessage = err.detail || `错误 ${resp.status}`;
          this.phase = 'error_input';
          return;
        }
        const data = await resp.json();
        this.jobId = data.job_id;
        this.queuePosition = data.queue_position;
        this.phase = 'polling';
        this.startPolling();
      } catch (e) {
        this.errorMessage = '网络错误：' + e.message;
        this.phase = 'error_input';
      }
    },

    startPolling() {
      this.pollTimer = setInterval(() => this.poll(), 2000);
      this.poll();
    },

    async poll() {
      try {
        const resp = await fetch(`/jobs/${this.jobId}`);
        if (!resp.ok) return;
        const data = await resp.json();
        this.status = data.status;
        this.progress = data.progress;
        this.videoTitle = data.video_title || '';
        this.availableFormats = data.available_formats || [];
        this.queuePosition = data.queue_position;
        if (data.status === 'done') {
          clearInterval(this.pollTimer);
          this.phase = 'ready_to_download';
        } else if (data.status === 'failed') {
          clearInterval(this.pollTimer);
          this.errorMessage = data.error || '处理失败';
          this.phase = 'error_processing';
        } else if (data.status === 'cancelled') {
          clearInterval(this.pollTimer);
          this.reset();
        }
      } catch (e) {
        // transient network error; let polling continue
      }
    },

    statusLabel() {
      const map = {
        queued: this.queuePosition ? `正在排队（第 ${this.queuePosition} 位）...` : '正在排队...',
        pending: '即将开始...',
        fetching: '正在抓取视频信息...',
        transcribing: '正在转写音频...',
        summarizing: '正在生成摘要...',
        rendering: '正在渲染输出...',
      };
      return map[this.status] || this.status;
    },

    retry() {
      this.errorMessage = '';
      this.submit();
    },

    reset() {
      if (this.pollTimer) clearInterval(this.pollTimer);
      this.phase = 'idle';
      this.url = '';
      this.jobId = null;
      this.progress = 0;
      this.errorMessage = '';
      this.videoTitle = '';
      this.availableFormats = [];
    },
  }
}

function myJobsApp() {
  return {
    jobs: [],
    systemActiveCount: 0,
    systemQueueFull: false,
    pollTimer: null,

    init() {
      this.refresh();
      this.startPolling();
    },

    startPolling() {
      this.pollTimer = setInterval(() => this.refresh(), 3000);
    },

    async refresh() {
      try {
        const resp = await fetch('/my/jobs');
        if (!resp.ok) return;
        const data = await resp.json();
        this.jobs = data.jobs || [];
        this.systemActiveCount = data.system.active_count;
        this.systemQueueFull = data.system.queue_full;
        this._maybeStopPolling();
      } catch (e) {
        // transient; ignore
      }
    },

    _maybeStopPolling() {
      const hasActive = this.systemActiveCount > 0;
      const hasNonTerminalLocal = this.jobs.some(j => !this.isTerminal(j.status));
      if (!hasActive && !hasNonTerminalLocal && this.pollTimer) {
        clearInterval(this.pollTimer);
        this.pollTimer = null;
      }
    },

    async cancel(jobId) {
      try {
        await fetch(`/jobs/${jobId}`, { method: 'DELETE' });
        this.refresh();
      } catch (e) {
        // ignore
      }
    },

    isTerminal(status) {
      return ['done', 'failed', 'cancelled'].includes(status);
    },

    statusLabel(j) {
      const map = {
        queued: j.queue_position ? `排队中 #${j.queue_position}` : '排队中',
        pending: '即将开始',
        fetching: `处理中 ${j.progress}%`,
        transcribing: `处理中 ${j.progress}%`,
        summarizing: `处理中 ${j.progress}%`,
        rendering: `处理中 ${j.progress}%`,
        done: '已完成',
        failed: '失败',
        cancelled: '已取消',
      };
      return map[j.status] || j.status;
    },

    badgeClass(status) {
      if (status === 'queued') return 'badge-queued';
      if (status === 'done') return 'badge-done';
      if (status === 'failed') return 'badge-failed';
      if (status === 'cancelled') return 'badge-cancelled';
      return 'badge-processing';  // pending / fetching / transcribing / summarizing / rendering
    },
  };
}
</script>

</body>
</html>
